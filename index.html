<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый сайт</title>
</head>
<body>
  <script>
    // Refresh an existing legacy worker, without registering one for a new visitor.
    // The retirement worker removes only the old site's offline caches.
    if ('serviceWorker' in navigator) {
      const scope = new URL('./', location.href).href;
      navigator.serviceWorker.getRegistrations().then(registrations =>
        Promise.all(registrations.filter(registration => registration.scope === scope)
          .map(registration => registration.update()))
      ).catch(() => {});
    }
  </script>
</body>
</html>
